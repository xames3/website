[build-system]
requires = [ "setuptools>=77" ]
build-backend = "setuptools.build_meta"

[project]
name = "kaamiki"
dynamic = [ "dependencies", "version" ]
authors = [
    { name = "Akshay Mestry", email = "xa@mes3.dev" }
]
description = "Sphinx theme and extension utility for Akshay's corner."
readme = "README.rst"
requires-python = ">=3.14"
keywords = [ "education", "learning", "sphinx", "python", "kaamiki" ]
license = "MIT"
license-files = [ "LICENSE-CODE" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation"
]

[project.urls]
homepage = "https://github.com/xames3/website"
repository = "https://github.com/xames3/website"
issues = "https://github.com/xames3/website/issues"

[project.entry-points."sphinx.html_themes"]
kaamiki = "kaamiki"

[dependency-groups]
dev = [ "sphinx-lint>=1.0.2", "tox>=4.11" ]

[tool.setuptools]
packages = [ "kaamiki", "kaamiki.extensions", "kaamiki.extensions.explainer" ]

[tool.setuptools.package-data]
kaamiki = [ "base/static/*", "base/templates/*" ]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
version = { attr = "kaamiki.version" }

[tool.djlint]
profile = "jinja"
indent = 4
format_css = true
format_js = true
max_attribute_length = 1
max_line_length = 80

[tool.ruff]
line-length = 80
target-version = "py314"
fix = true
unsafe-fixes = false
respect-gitignore = true
extend-exclude = [
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".tox",
  ".venv",
  "__pycache__",
  "archive",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "A",        # flake8-builtins
  "ANN",      # flake8-annotations
  "ARG",      # flake8-unused-arguments
  "B",        # flake8-bugbear
  "BLE",      # flake8-blind-except
  "C4",       # flake8-comprehensions
  "COM",      # flake8-commas
  "D",        # pydocstyle
  "DTZ",      # flake8-datetimez
  "E",        # pycodestyle errors
  "EM",       # flake8-errmsg
  "EXE",      # flake8-executable
  "F",        # pyflakes
  "FA",       # flake8-future-annotations
  "FBT",      # flake8-boolean-trap
  "FLY",      # flynt
  "FURB",     # refurb
  "G",        # flake8-logging-format
  "I",        # isort
  "ICN",      # flake8-import-conventions
  "INP",      # flake8-no-pep420
  "INT",      # flake8-gettext
  "ISC",      # flake8-implicit-str-concat
  "LOG",      # flake8-logging
  "N",        # pep8-naming
  "PERF",     # perflint
  "PIE",      # flake8-pie
  "PYI",      # flake8-pyi
  "Q",        # flake8-quotes
  "RET",      # flake8-return
  "RSE",      # flake8-raise
  "RUF",      # ruff-specific rules
  "S",        # flake8-bandit
  "SIM",      # flake8-simplify
  "SLF",      # flake8-self
  "SLOT",     # flake8-slots
  "T10",      # flake8-debugger
  "T20",      # flake8-print
  "TC",       # flake8-type-checking
  "TID",      # flake8-tidy-imports
  "TRY",      # tryceratops
  "UP",       # pyupgrade
  "W",        # pycodestyle warnings
]
ignore = [
  "ANN001",   # Missing type annotation for function argument
  "ANN003",   # Missing type annotation for `**kwargs`
  "ANN201",   # Missing return type annotation for public function
  "ANN202",   # Missing return type annotation for private function
  "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
  "BLE001",   # Do not catch blind exception
  "COM812",   # Missing trailing comma (conflicts with formatter)
  "D100",     # Missing docstring in public module
  "D101",     # Missing docstring in public class
  "D102",     # Missing docstring in public method
  "D103",     # Missing docstring in public function
  "D104",     # Missing docstring in public package
  "D107",     # Missing docstring in `__init__`
  "D205",     # 1 blank line required between summary line and description
  "D415",     # First line should end with a period, question mark, or exclamation point
  "DTZ005",   # Datetime called without `tz` parameter
  "EM101",    # Exception must not use a string literal
  "EM102",    # Exception must not use an f-string literal
  "EXE002",   # Script file is executable but does not have a shebang
  "F403",     # Name may be undefined
  "F405",     # Name defined from star imports
  "FBT003",   # Boolean positional value in function call
  "INP001",   # Part of implicit namespace package
  "ISC001",   # Implicitly concatenated string literals (conflicts with formatter)
  "N801",     # Class name should use CapWords convention
  "N806",     # Variable in function should be lowercase
  "S101",     # Use of assert detected
  "S311",     # Pseudo-random generators are not suitable for cryptography
  "SLF001",   # Private member accessed
  "T201",     # Print found
  "TID252",   # Relative imports are not allowed
  "TRY003",   # Avoid specifying long messages outside the exception class
  "TRY301",   # Abstract `raise` to an inner function
]
unfixable = [
  "F401",     # Unused imports
  "F841",     # Unused variables
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = false

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-single-line = true
known-first-party = ["kaamiki"]
order-by-type = true
relative-imports-order = "closest-to-furthest"
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = true

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
]
staticmethod-decorators = [
  "staticmethod",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
files = [ "kaamiki" ]
python_version = "3.14"
strict = true
disallow_subclassing_any = false  # docutils/Sphinx base classes are untyped
follow_imports = "silent"
ignore_missing_imports = true
pretty = true
show_absolute_path = true
show_column_numbers = true
show_error_context = true
warn_unreachable = true

[tool.tox]
requires = [ "tox>=4.11" ]
env_list = [
  "website",
  "lint",
  "format",
  "typecheck",
]
package = "editable"

[tool.tox.env.lint]
description = "Run linting with ruff"
deps = [ "ruff>=0.12.7" ]
commands = [
  [ "ruff", "check", ".", "--diff" ],
]

[tool.tox.env.format]
description = "Check code formatting with ruff"
deps = [
  "ruff>=0.12.7",
]
commands = [
  [ "ruff", "format", ".", "--check" ],
]

[tool.tox.env.typecheck]
description = "Run type checking"
deps = [
  "mypy>=1.8.0",
  "types-docutils",
]
commands = [
  [ "mypy", "kaamiki/", "docs/source/conf.py" ],
]

[tool.tox.env.website]
description = "Check HTML and Jinja formatting with djlint"
deps = [ "djlint==1.36.4" ]
commands = [
  [ "djlint", "kaamiki/base/templates", "docs/source/_static/", "docs/source/assets/html", "-e", "html", "--check" ],
  [ "djlint", "kaamiki/base/templates", "docs/source/_static/", "-e", "html.jinja", "--check" ],
]

[tool.tox.env.reformat]
description = "Reformat the HTML, Jinja and Python sources in place"
deps = [ "djlint==1.36.4", "ruff>=0.12.7" ]
commands = [
  [ "djlint", "kaamiki/base/templates", "docs/source/_static/", "docs/source/assets/html", "-e", "html", "--reformat" ],
  [ "djlint", "kaamiki/base/templates", "docs/source/_static/", "-e", "html.jinja", "--reformat" ],
  [ "ruff", "format", "." ],
]
