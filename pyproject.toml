[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaamiki-sphinx-theme"
dynamic = ["version"]
authors = [{ name = "Akshay Mestry", email = "xa@mes3.dev" }]
description = "Sphinx theme and extension utility for Akshay Mestry's website."
readme = "README.rst"
requires-python = ">=3.14"
dependencies = [
    "babel>=2.13",
    "beautifulsoup4>=4.12.3",
    "docutils>=0.21",
    "jinja2>=3.1.6",
    "lightningcss>=0.3.1",
    "pygments>=2.18.0",
    "sphinx>=9.1,<11",
    "sphinx-copybutton>=0.5.0",
]
keywords = [
    "documentation",
    "education",
    "kaamiki",
    "python",
    "sphinx",
    "sphinx-extension",
    "sphinx-theme",
]
license = "MIT"
license-files = [
    "LICENSE-CODE",
    "kaamiki/theme/static/styles/MIT-tailwindcss.txt",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://xa.mes3.dev/"
Documentation = "https://xa.mes3.dev/docs/kaamiki/"
Source = "https://github.com/xames3/website"
Issues = "https://github.com/xames3/website/issues"
Changelog = "https://xa.mes3.dev/changelog/"
Funding = "https://github.com/sponsors/xames3"

[project.entry-points."sphinx.html_themes"]
kaamiki = "kaamiki"

[dependency-groups]
dev = ["sphinx-lint>=1.0.2", "tox>=4.65.4"]

[tool.setuptools.packages.find]
include = ["kaamiki*"]
namespaces = true

[tool.setuptools.package-data]
kaamiki = [
    "py.typed",
    "theme/static/**/*",
    "theme/templates/**/*",
    "locale/*.pot",
    "locale/*/LC_MESSAGES/*",
]

[tool.setuptools.dynamic]
version = { attr = "kaamiki.__version__" }

[tool.check-wheel-contents]
# The Tailwind licence ships twice on purpose, as package data beside theme.css
# and as a licence file.
# https://peps.python.org/pep-0639/#add-license-file-field
ignore = ["W002"]

[tool.djlint]
profile = "jinja"
indent = 4
format_js = true
max_attribute_length = 1
max_line_length = 80
ignore = "H031"

[tool.ruff]
line-length = 80
target-version = "py314"
extend-exclude = ["archive", "build"]

[tool.ruff.lint]
# Rule codes: https://docs.astral.sh/ruff/rules/
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "COM",
    "D",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "ANN401",
    "COM812",
    "D205",
    "D415",
    "DTZ005",
    "EM101",
    "EM102",
    "FBT003",
    "INP001",
    "N801",
    "S311",
    "SLF001",
    "TRY003",
    "TRY301",
]
unfixable = ["F401", "F841"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
known-first-party = ["kaamiki"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
files = ["kaamiki", "docs/source/conf.py"]
python_version = "3.14"
strict = true
follow_imports = "silent"
pretty = true
show_absolute_path = true
show_column_numbers = true
show_error_context = true
warn_unreachable = true

[tool.tox]
requires = ["tox>=4.65.4"]
env_list = [
    "sphinxlint",
    "lint",
    "format",
    "typecheck",
    "website-check",
    "translations-check",
]

[tool.tox.env.sphinxlint]
description = "Lint the reStructuredText sources with sphinx-lint"
skip_install = true
deps = ["sphinx-lint==1.0.2"]
commands = [
    [
        "sphinx-lint",
        "--disable",
        "role-with-double-backticks,role-without-backticks",
        "--enable",
        "line-too-long",
        "--max-line-length",
        "80",
        "--ignore",
        "docs/source/locales",
        "docs/source",
    ],
]

[tool.tox.env.lint]
description = "Lint with ruff and change nothing"
skip_install = true
deps = ["ruff==0.17.3"]
commands = [
    [
        "ruff",
        "check",
        ".",
        { replace = "posargs", extend = true },
    ],
]

[tool.tox.env.format]
description = "Check the Python formatting with ruff and change nothing"
skip_install = true
deps = [
    "ruff==0.17.3",
]
commands = [
    [
        "ruff",
        "format",
        "--check",
        ".",
        { replace = "posargs", extend = true },
    ],
]

[tool.tox.env.typecheck]
description = "Check the types with mypy"
skip_install = true
deps = [
    "mypy==2.4.1",
    "types-docutils==0.23.0.20261030",
    "types-Pygments==2.21.0.20260819",
    "babel",
    "beautifulsoup4",
    "docutils",
    "jinja2",
    "lightningcss",
    "pygments",
    "sphinx",
    "sphinx-copybutton",
]
commands = [["mypy", { replace = "posargs", extend = true }]]

[tool.tox.env.website-check]
description = "Check and lint HTML and Jinja with djlint, change nothing"
skip_install = true
deps = ["djlint==1.36.4"]
commands = [
    [
        "djlint",
        "kaamiki/theme/templates",
        "docs/source/_static/",
        "docs/source/assets/html",
        "-e",
        "html",
        "--check",
    ],
    [
        "djlint",
        "kaamiki/theme/templates",
        "docs/source/_static/",
        "-e",
        "html.jinja",
        "--check",
    ],
    [
        "djlint",
        "kaamiki/theme/templates",
        "-e",
        "html",
        "--lint",
    ],
    [
        "djlint",
        "kaamiki/theme/templates",
        "-e",
        "html.jinja",
        "--lint",
        "--include",
        "H017",
    ],
]

[tool.tox.env.translations]
description = "Extract Kaamiki's words, then update and compile the catalogues"
skip_install = true
deps = ["babel==2.18.0", "jinja2==3.1.6"]
allowlist_externals = ["git", "sh"]
commands = [
    [
        "sh",
        "-c",
        '''
        pybabel extract -F babel.cfg -o "$1" --no-location \
            --project=Kaamiki \
            --version="$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' \
                kaamiki/__init__.py)" \
            --copyright-holder="Akshay Mestry" \
            --msgid-bugs-address=xa@mes3.dev \
            --header-comment="# Translations template for Kaamiki.
# Copyright (C) 2026 Akshay Mestry
# This file is distributed under the same licence as the Kaamiki project.
# Akshay Mestry <xa@mes3.dev>, 2026.
#" \
            kaamiki
        ''',
        "sh",
        "kaamiki/locale/sphinx.pot",
    ],
    [
        "pybabel",
        "update",
        "--ignore-obsolete",
        "--ignore-pot-creation-date",
        "--update-header-comment",
        "-i",
        "kaamiki/locale/sphinx.pot",
        "-d",
        "kaamiki/locale",
        "-D",
        "sphinx",
    ],
    [
        "sh",
        "-c",
        '''
        pot=kaamiki/locale/sphinx.pot
        version=$(grep -m1 '^"Project-Id-Version:' "$pot")
        for po in kaamiki/locale/*/LC_MESSAGES/sphinx.po; do
            VERSION="$version" awk '
                /^"Project-Id-Version:/ { print ENVIRON["VERSION"]; next }
                { print }
            ' "$po" > "$po.tmp" && mv "$po.tmp" "$po"
        done
        if git ls-files --error-unmatch "$pot" >/dev/null 2>&1 \
            && git diff --quiet -IPOT-Creation-Date -- "$pot"; then
            git checkout -- "$pot"
        fi
        ''',
    ],
    [
        "pybabel",
        "compile",
        "-d",
        "kaamiki/locale",
        "-D",
        "sphinx",
    ],
]

[tool.tox.env.translations-check]
description = "Fail when the catalogues are behind the sources, write nothing"
skip_install = true
deps = ["babel==2.18.0", "jinja2==3.1.6"]
allowlist_externals = ["sh"]
commands = [
    [
        "sh",
        "-c",
        '''
        pybabel extract -F babel.cfg -o "$1" --no-location \
            --project=Kaamiki \
            --version="$(sed -n 's/^__version__: str = "\(.*\)"$/\1/p' \
                kaamiki/__init__.py)" \
            --copyright-holder="Akshay Mestry" \
            --msgid-bugs-address=xa@mes3.dev \
            --header-comment="# Translations template for Kaamiki.
# Copyright (C) 2026 Akshay Mestry
# This file is distributed under the same licence as the Kaamiki project.
# Akshay Mestry <xa@mes3.dev>, 2026.
#" \
            kaamiki
        ''',
        "sh",
        "{env_tmp_dir}/sphinx.pot",
    ],
    [
        "pybabel",
        "update",
        "--check",
        "--ignore-pot-creation-date",
        "--ignore-obsolete",
        "--update-header-comment",
        "-i",
        "{env_tmp_dir}/sphinx.pot",
        "-d",
        "kaamiki/locale",
        "-D",
        "sphinx",
    ],
]

[tool.tox.env.reformat]
description = "Fix lint and reformat the Python, HTML and Jinja in place"
skip_install = true
deps = [
    "djlint==1.36.4",
    "ruff==0.17.3",
]
commands = [
    [
        "djlint",
        "kaamiki/theme/templates",
        "docs/source/_static/",
        "docs/source/assets/html",
        "-e",
        "html",
        "--reformat",
    ],
    [
        "djlint",
        "kaamiki/theme/templates",
        "docs/source/_static/",
        "-e",
        "html.jinja",
        "--reformat",
    ],
    [
        "ruff",
        "check",
        ".",
        "--fix",
        "--exit-zero",
    ],
    [
        "ruff",
        "format",
        ".",
    ],
]

[tool.tox.env.package-check]
description = "Build the sdist and the wheel and check them, without publishing"
skip_install = true
allowlist_externals = ["sh"]
deps = [
    "build[uv]==1.6.1",
    "check-wheel-contents==0.6.3",
    "twine==7.0.0",
    "uv==0.13.6",
    "validate-pyproject==0.27",
]
commands = [
    [
        "sh",
        "-c",
        "rm -rf ./*.egg-info",
    ],
    [
        "validate-pyproject",
        "pyproject.toml",
    ],
    [
        "python",
        "-m",
        "build",
        "--installer",
        "uv",
        "--outdir",
        "{env_tmp_dir}/dist",
    ],
    [
        "twine",
        "check",
        "--strict",
        "{env_tmp_dir}/dist/*",
    ],
    [
        "check-wheel-contents",
        "{env_tmp_dir}/dist",
    ],
]
