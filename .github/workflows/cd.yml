# Last updated on: 15 October 2026

name: Continuous Deployment
run-name: Started ${{ github.workflow }} (CD) workflow

# NOTE(xames3): This workflow only publishes the pages artifact that the
# build job of ci.yml uploaded in the same run. Nothing is rebuilt here. To
# redeploy without a new commit, run the CI workflow on main by hand.
on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the pages artifact the build job uploaded"
        required: true
        type: string

permissions:
  contents: read

# NOTE(xames3): The group can't use github.workflow here. In a called
# workflow it resolves to the caller's name and would deadlock with CI.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy built website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ inputs.artifact }}
