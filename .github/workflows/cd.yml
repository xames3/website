name: Continuous Deployment
run-name: Started ${{ github.workflow }} (CD) workflow

on:
  workflow_dispatch:

env:
  ARTIFACT_NAME: webpages
  OUTPUT_DIR: docs/build/
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install documentation dependencies
        run: |
          python -m pip install -Uq pip
          python -m pip install -Uq -e . --group dev
      - name: Restore intersphinx inventories
        uses: actions/cache@v6
        with:
          path: docs/.cache/intersphinx
          key: intersphinx-${{ github.run_id }}
          restore-keys: intersphinx-
      - name: Fetch intersphinx inventories
        run: make --directory docs inventories
      - name: Build HTML pages with Sphinx
        run: make --directory docs html
      - name: Leave Sphinx's build state out of the site
        run: rm -rf "${OUTPUT_DIR}.doctrees" "${OUTPUT_DIR}".buildinfo*
      - name: Upload built documentation as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    name: Deploy built website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.ARTIFACT_NAME }}
