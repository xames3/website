# Last updated on: 2 November 2026

name: Continuous Deployment
run-name: Started ${{ github.workflow }} (CD) workflow

on:
  workflow_call:
    inputs:
      artifact:
        description: "Name of the pages artifact the build job uploaded"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy built website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ inputs.artifact }}
