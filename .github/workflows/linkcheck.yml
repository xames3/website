name: Link Check
run-name: Started ${{ github.workflow }} workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  linkcheck:
    name: Check external links
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and check the distributions
        run: tox -e package-check
      - name: Install the wheel
        run: python -m pip install -q .tox/package-check/tmp/dist/*.whl
      - name: Restore intersphinx inventories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.cache/intersphinx
          key: intersphinx-${{ github.run_id }}
          restore-keys: intersphinx-
      - name: Fetch intersphinx inventories
        run: make --directory docs inventories
      - name: Check external links with Sphinx
        run: make --directory docs linkcheck
