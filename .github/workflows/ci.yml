name: Continuous Integration
run-name: Started ${{ github.workflow }} (CI) workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/**"
      - "LICENSE*"
      - "README.rst"
      - "babel.cfg"
      - "docs/**"
      - "kaamiki/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: read

env:
  ARTIFACT_NAME: webpages
  OUTPUT_DIR: docs/build/
  PYTHON_VERSION: "3.14"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      requirements-cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute requirements cache key
        id: cache-key
        run: echo "key=${{ runner.os }}-pip-$(cat requirements.txt pyproject.toml | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

  lint:
    name: Lint Python code
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install project dependencies
        run: python -m pip install -Uq pip tox
      - name: Run linting (ruff)
        run: tox -e lint -- --no-fix

  format:
    name: Format Python code
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install project dependencies
        run: python -m pip install -Uq pip tox
      - name: Run formatting (ruff)
        run: tox -e format -- --check

  typecheck:
    name: Typecheck Python code
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install project dependencies
        run: python -m pip install -Uq pip tox
      - name: Run typechecking (mypy)
        run: tox -e typecheck

  templates:
    name: Check HTML and Jinja templates
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install project dependencies
        run: python -m pip install -Uq pip tox
      - name: Run template checks (djlint)
        run: tox -e website-check

  translations:
    name: Check translation catalogs
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install project dependencies
        run: python -m pip install -Uq pip tox
      - name: Run catalog checks (babel)
        run: tox -e translations-check

  sphinxlint:
    name: Lint rST files
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install documentation dependencies
        run: |
          python -m pip install -Uq pip
          python -m pip install -Uq -e . --group dev
      - name: Run Sphinx linting
        run: make --directory docs check

  build:
    name: Build website pages
    needs:
      - prepare
      - lint
      - format
      - typecheck
      - templates
      - translations
      - sphinxlint
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ env.ARTIFACT_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ needs.prepare.outputs.requirements-cache-key }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install documentation dependencies
        run: |
          python -m pip install -Uq pip
          python -m pip install -Uq -e . --group dev
      - name: Restore intersphinx inventories
        uses: actions/cache@v6
        with:
          path: docs/.cache/intersphinx
          key: intersphinx-${{ github.run_id }}
          restore-keys: intersphinx-
      - name: Fetch intersphinx inventories
        run: make --directory docs inventories
      - name: Build HTML pages with Sphinx
        run: make --directory docs html
      - name: Leave Sphinx's build state out of the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: rm -rf "${OUTPUT_DIR}.doctrees" "${OUTPUT_DIR}".buildinfo*
      - name: Upload built documentation as artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    name: Deploy built website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
