# Continuous Integration (CI) Workflow
# ====================================
#
# Author: Akshay Mestry <xa@mes3.dev>
# Created on: 26 August 2025
# Last updated on: 07 November 2026

name: Continuous Integration
run-name: Started ${{ github.workflow }} (CI) workflow

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/**"
      - "LICENSE*"
      - "MANIFEST.in"
      - "README.rst"
      - "babel.cfg"
      - "docs/**"
      - "kaamiki/**"
      - "pyproject.toml"

permissions:
  contents: read

env:
  ARTIFACT_NAME: webpages
  OUTPUT_DIR: docs/build/
  PYTHON_VERSION: "3.14"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint Python code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run linting (ruff)
        run: tox -e lint

  format:
    name: Check Python formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check formatting (ruff)
        run: tox -e format

  typecheck:
    name: Check Python types
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check types (mypy)
        run: tox -e typecheck

  templates:
    name: Check HTML and Jinja templates
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run template checks (djlint)
        run: tox -e website-check

  translations:
    name: Check translation catalogues
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run catalogue checks (babel)
        run: tox -e translations-check

  sphinxlint:
    name: Lint rST files
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python and tox
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Lint the rST (sphinx-lint)
        run: tox -e sphinxlint

  build:
    name: Build website pages
    needs:
      - lint
      - format
      - typecheck
      - templates
      - translations
      - sphinxlint
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ env.ARTIFACT_NAME }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: ./.github/actions/setup
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build the wheel
        run: |
          python -m pip install -q build
          python -m build --wheel
      - name: Install the wheel
        run: python -m pip install -q dist/*.whl
      - name: Restore intersphinx inventories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.cache/intersphinx
          key: intersphinx-${{ github.run_id }}
          restore-keys: intersphinx-
      - name: Fetch intersphinx inventories
        run: make --directory docs inventories
      - name: Build HTML pages with Sphinx
        run: make --directory docs html CHECK=
      - name: Leave Sphinx's build record out of the site
        if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
        run: rm -f "${OUTPUT_DIR}".buildinfo*
      - name: Upload built documentation as artifact
        if: >-
          github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    name: Deploy built website
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      artifact: ${{ needs.build.outputs.artifact }}
