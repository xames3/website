name: Setup Python and tools
description: Install Python, restore the pip cache and install what a job runs

inputs:
  python-version:
    description: "Python version to install"
    required: true
  cache-key:
    description: "Key of the pip cache, from the prepare job"
    required: true
  install:
    description: "What to install, tox or the documentation dependencies"
    default: tox

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ runner.os }}-pip-
    - name: Install project dependencies
      if: inputs.install == 'tox'
      shell: bash
      run: python -m pip install -Uq pip tox
    - name: Install documentation dependencies
      if: inputs.install == 'docs'
      shell: bash
      run: |
        python -m pip install -Uq pip
        python -m pip install -Uq -e . --group dev
