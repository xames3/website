<div class="contributed-at__container"
     data-source="{{ source }}">
    <p class="contributed-at__title">Contributed at</p>
    <div class="contributed-at-scroller"
         data-contributed-at-scroller
         data-speed="{{ data-speed }}"
         data-direction="{{ data-direction }}">
        <ul class="contributed-at-scroller__list">
        </ul>
    </div>
</div>
<style>
    .contributed-at__container {
        margin: 2rem 1rem;
    }

    .contributed-at-scroller {
        --km-contributed-at-scroll-base-duration: 30s;
        --km-contributed-at-gap: 3.5rem;
        --km-contributed-at-loop-distance: 50%;
        --km-organisation-logo-size: 10rem;
        --km-organisation-logo-height: 3.5rem;
        max-width: min(100%, 720px);
        margin-inline: auto;
    }

    .contributed-at__title {
        font-size: 1.25rem;
        letter-spacing: -0.86px;
        line-height: 1.5rem;
        text-align: center;
        margin-bottom: 1rem;
        font-weight: 500;
        color: hsl(var(--km-color-muted-fg));
    }

    .contributed-at-scroller[data-speed="fast"] {
        --km-contributed-at-scroll-duration: var(--km-contributed-at-scroll-base-duration);
    }

    .contributed-at-scroller[data-speed="slow"] {
        --km-contributed-at-scroll-duration: calc(1.5 * var(--km-contributed-at-scroll-base-duration));
    }

    .contributed-at-scroller[data-animated="true"] {
        overflow: hidden;
        -webkit-mask: linear-gradient(90deg, transparent 0%, black 15%, black 85%, transparent 100%);
        mask: linear-gradient(90deg, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .contributed-at-scroller__list {
        display: flex;
        align-items: center;
        gap: var(--km-contributed-at-gap);
        margin: 0;
        padding: 0;
        list-style: none;
        flex-wrap: wrap;
    }

    .contributed-at-scroller[data-animated="true"] .contributed-at-scroller__list {
        width: max-content;
        flex-wrap: nowrap;
        animation: contributed-at-scroll var(--km-contributed-at-scroll-duration) linear infinite;
        animation-play-state: running;
        will-change: transform;
        backface-visibility: hidden;
    }

    .contributed-at-scroller[data-direction="right"][data-animated="true"] .contributed-at-scroller__list {
        animation-direction: reverse;
    }

    .contributed-at-scroller__item {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        margin-top: 0 !important;
        flex: 0 0 auto;
        inline-size: var(--km-organisation-logo-size);
        min-block-size: calc(var(--km-organisation-logo-height) + 1rem);
        box-sizing: border-box;
    }

    .contributed-at-scroller__item--raised {
        margin-bottom: 0.75rem;
    }

    @media (min-width: 768px) {
        .contributed-at-scroller__item--raised {
            margin-bottom: 1.25rem;
        }
    }

    .contributed-at-scroller__item::before {
        content: "";
        display: block;
        inline-size: 100%;
        block-size: var(--km-organisation-logo-height);
        background-color: hsl(var(--km-color-fg));
        mask: var(--km-organisation-logo) center / contain no-repeat;
        -webkit-mask: var(--km-organisation-logo) center / contain no-repeat;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .contributed-at-scroller[data-animated="true"] .contributed-at-scroller__list:hover {
        animation-play-state: paused;
    }

    @keyframes contributed-at-scroll {
        from {
            transform: translate3d(0, 0, 0);
        }

        to {
            transform: translate3d(calc(-1 * var(--km-contributed-at-loop-distance, 50%)), 0, 0);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .contributed-at-scroller[data-animated="true"] .contributed-at-scroller__list {
            animation: none;
        }
    }
</style>
<script>
    (function() {
        let box = document.currentScript?.previousElementSibling;
        while (box && !box.matches('.contributed-at__container')) box = box.previousElementSibling;
        const scrollers = box ? box.querySelectorAll('[data-contributed-at-scroller]') : [];
        if (!scrollers.length) return;
        const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

        function setup() {
            scrollers.forEach((scroller) => {
                const list = scroller.querySelector('.contributed-at-scroller__list');
                if (!list) return;
                const originals = Array.from(list.children);
                if (originals.length < 2) {
                    scroller.dataset.animated = 'false';
                    return;
                }

                let resizeObserver;
                let lastDistance = 0;
                let resizeHandlerAttached = false;

                function updateLoopDistance() {
                    const first = list.children[originals.length];
                    if (!first) return;
                    const loopDistance = first.getBoundingClientRect().left - list.children[0].getBoundingClientRect().left;
                    if (!loopDistance) return;
                    if (Math.abs(loopDistance - lastDistance) < 0.5) return;
                    lastDistance = loopDistance;
                    list.style.setProperty('--km-contributed-at-loop-distance', `${loopDistance}px`);
                }

                function bindResizeListener() {
                    if (typeof ResizeObserver !== 'undefined') {
                        if (resizeObserver) return;
                        resizeObserver = new ResizeObserver(() => updateLoopDistance());
                        resizeObserver.observe(list);
                    } else if (!resizeHandlerAttached) {
                        resizeHandlerAttached = true;
                        window.addEventListener('resize', updateLoopDistance, {
                            passive: true
                        });
                    }
                }

                function enableAnimation() {
                    if (reduceMotionQuery.matches) return;
                    scroller.dataset.animated = 'true';
                    updateLoopDistance();
                }

                function initialise() {
                    if (!scroller.dataset.employedAtInit) {
                        originals.forEach((item) => {
                            const clone = item.cloneNode(true);
                            clone.setAttribute('aria-hidden', 'true');
                            list.appendChild(clone);
                        });
                        scroller.dataset.employedAtInit = '1';
                        bindResizeListener();
                    }
                    requestAnimationFrame(() => enableAnimation());
                }

                if (reduceMotionQuery.matches) {
                    scroller.dataset.animated = 'false';
                } else {
                    initialise();
                }

                reduceMotionQuery.addEventListener('change', (event) => {
                    if (event.matches) {
                        scroller.dataset.animated = 'false';
                        list.style.removeProperty('--km-contributed-at-loop-distance');
                    } else {
                        initialise();
                    }
                });
            });
        }

        function render(organisations) {
            const list = box.querySelector('.contributed-at-scroller__list');
            organisations.forEach((organisation) => {
                const item = document.createElement('li');
                item.className = 'contributed-at-scroller__item';
                if (organisation.raised) item.classList.add('contributed-at-scroller__item--raised');
                item.style.setProperty('--km-organisation-logo', `url("${organisation.logo}")`);
                if (organisation.width) item.style.inlineSize = organisation.width;
                const label = document.createElement('span');
                label.className = 'sr-only';
                label.textContent = organisation.name;
                item.appendChild(label);
                list.appendChild(item);
            });
        }

        fetch(box.dataset.source)
            .then((response) => response.json())
            .then((organisations) => {
                render(organisations);
                setup();
            })
            .catch(() => {});
    })();
</script>
