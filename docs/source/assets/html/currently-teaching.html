<div class="currently-teaching">
    <p class="currently-teaching__text">
        I've taught&nbsp;<span class="currently-teaching__course"
      id="course"></span><span class="blinking-cursor"></span>
    </p>
</div>
<style>
    .currently-teaching {
        margin: calc(92px / 1.5) 1rem;
        text-align: center;
    }

    .currently-teaching__text {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -1.66px;
        line-height: 1.25rem;
        color: hsl(var(--km-color-muted-fg));
    }

    .currently-teaching__course {
        color: hsl(var(--km-color-fg));
    }

    @media (max-width: 768px) {
        .currently-teaching__text {
            letter-spacing: -0.86px;
            font-size: 1.25rem;
            line-height: 1.5;
        }
    }
</style>
<!-- djlint:off -->
<script>
    (function() {
        var courses = {{ courses }}
        var element = document.getElementById("course");
        var courseIndex = 0;
        var charIndex = 0;
        var isDeleting = false;

        if (!element || !courses.length) return;

        function tick() {
            var current = courses[courseIndex];
            if (!isDeleting) {
                charIndex++;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === current.length) {
                    element.classList.add(
                        "currently-teaching__course--idle"
                    );
                    isDeleting = true;
                    setTimeout(function() {
                        element.classList.remove(
                            "currently-teaching__course--idle"
                        );
                        tick();
                    }, {{ pause-after-typing }});
                    return;
                }
                setTimeout(tick, {{ typing-speed }});
            } else {
                charIndex--;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === 0) {
                    isDeleting = false;
                    courseIndex = (courseIndex + 1) % courses.length;
                    setTimeout(tick, {{ pause-after-deleting }});
                    return;
                }
                setTimeout(tick, {{ deleting-speed }});
            }
        }

        tick();
    })();
</script>
<!-- djlint:on -->
