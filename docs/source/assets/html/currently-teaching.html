<div class="am-currently-teaching"
     data-am-source="{{ source }}"
     data-am-typing-speed="{{ typing-speed }}"
     data-am-deleting-speed="{{ deleting-speed }}"
     data-am-pause-after-typing="{{ pause-after-typing }}"
     data-am-pause-after-deleting="{{ pause-after-deleting }}">
    <p class="am-currently-teaching__text">
        {# djlint:off #}
        {{ prefix-text }}<span
            class="am-currently-teaching__course"></span><span
            class="am-blinking-cursor"></span>
        {# djlint:on #}
    </p>
</div>
