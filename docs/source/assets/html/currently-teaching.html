<div class="currently-teaching"
     data-source="{{ source }}">
    <p class="currently-teaching__text">
        {{ prefix-text }}<span class="currently-teaching__course"></span><span class="km-blinking-cursor"></span>
    </p>
</div>
<style>
    .currently-teaching {
        margin: calc(92px / 1.5) 0;
    }

    .currently-teaching__text {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -1.66px;
        line-height: 1.25rem;
        color: hsl(var(--km-color-muted-fg));
    }

    .currently-teaching__course {
        color: hsl(var(--km-color-fg));
    }

    @media (max-width: 768px) {
        .currently-teaching__text {
            letter-spacing: -0.86px;
            font-size: 1.25rem;
            line-height: 1.5;
        }
    }
</style>
{# djlint:off #}
<script>
    (function() {
        var box = document.currentScript && document.currentScript.previousElementSibling;
        while (box && !box.classList.contains("currently-teaching")) box = box.previousElementSibling;
        var element = box && box.querySelector(".currently-teaching__course");
        var cursor = box && box.querySelector(".km-blinking-cursor");
        var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var courses = [];
        var courseIndex = 0;
        var charIndex = 0;
        var isDeleting = false;

        if (!element) return;

        fetch(box.getAttribute("data-source"))
            .then(function(response) { return response.json(); })
            .then(function(data) {
                courses = data.map(function(item) { return item.name; });
                if (courses.length) start();
            })
            .catch(function() {});

        function start() {
        if (still) {
            element.textContent = courses.length > 1
                ? courses.slice(0, -1).join(", ") + " and " + courses[courses.length - 1]
                : courses[0];
            if (cursor) cursor.style.display = "none";
            return;
        }

        function human(speed, last) {
            var wait = speed * (0.6 + Math.random() * 0.8);
            if (last === " " || last === "," || last === "-") wait += speed * Math.random();
            if (Math.random() < 0.06) wait += speed * (2 + Math.random() * 2);
            return Math.round(wait);
        }

        function typing(on) {
            if (cursor) cursor.classList.toggle("km-is-typing", on);
        }

        function tick() {
            var current = courses[courseIndex];
            if (!isDeleting) {
                typing(true);
                charIndex++;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === current.length) {
                    element.classList.add(
                        "currently-teaching__course--idle"
                    );
                    isDeleting = true;
                    typing(false);
                    setTimeout(function() {
                        element.classList.remove(
                            "currently-teaching__course--idle"
                        );
                        tick();
                    }, {{ pause-after-typing }});
                    return;
                }
                setTimeout(tick, human({{ typing-speed }}, current.charAt(charIndex - 1)));
            } else {
                typing(true);
                charIndex--;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === 0) {
                    isDeleting = false;
                    courseIndex = (courseIndex + 1) % courses.length;
                    typing(false);
                    setTimeout(tick, {{ pause-after-deleting }});
                    return;
                }
                setTimeout(tick, human({{ deleting-speed }}, ""));
            }
        }

        tick();
        }
    })();
</script>
{# djlint:on #}
