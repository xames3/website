<div class="currently-teaching">
    <p class="currently-teaching__text">
        I'm teaching&nbsp;<span class="currently-teaching__course"
      id="course"></span><span class="blinking-cursor"></span>this year.
    </p>
</div>
<style>
    .currently-teaching {
        margin: calc(92px / 1.5) 1rem;
        text-align: center;
    }

    .currently-teaching__text {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -1.66px;
        line-height: 1.25rem;
        color: hsl(var(--muted-foreground));
    }

    .currently-teaching__course {
        color: hsl(var(--foreground));
    }

    @media (max-width: 768px) {
        .currently-teaching__text {
            letter-spacing: -0.86px;
            font-size: 1.25rem;
            line-height: 1.5;
        }
    }
</style>
<script>
    (function() {
        var courses = [
            "Programming",
            "Data Analysis",
            "Cloud Computing",
        ];
        var element = document.getElementById("course");
        if (!element || !courses.length) return;

        var TYPING_SPEED = 120;
        var DELETING_SPEED = 80;
        var PAUSE_AFTER_TYPING = 2000;
        var PAUSE_AFTER_DELETING = 1000;

        var courseIndex = 0;
        var charIndex = 0;
        var isDeleting = false;

        function tick() {
            var current = courses[courseIndex];
            if (!isDeleting) {
                charIndex++;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === current.length) {
                    element.classList.add(
                        "currently-teaching__course--idle"
                    );
                    isDeleting = true;
                    setTimeout(function() {
                        element.classList.remove(
                            "currently-teaching__course--idle"
                        );
                        tick();
                    }, PAUSE_AFTER_TYPING);
                    return;
                }
                setTimeout(tick, TYPING_SPEED);
            } else {
                charIndex--;
                element.textContent = current.substring(0, charIndex);
                if (charIndex === 0) {
                    isDeleting = false;
                    courseIndex = (courseIndex + 1) % courses.length;
                    setTimeout(tick, PAUSE_AFTER_DELETING);
                    return;
                }
                setTimeout(tick, DELETING_SPEED);
            }
        }

        tick();
    })();
</script>
