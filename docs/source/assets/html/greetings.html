<div class="am-greetings"
     role="group"
     aria-label="Greeting"
     data-am-source="{{ source }}"
     data-am-interval="{{ interval }}"
     data-am-duration="{{ duration }}"
     data-am-stagger="{{ stagger }}">
    <p class="am-greetings__text">
        <span class="am-greetings__word">Hello.</span>
    </p>
</div>
